name: CI

# Disabled for solo work — build+test already run locally, and the
# release workflow has its own build/test gate. Re-add `push`/`pull_request`
# triggers here (see git history) to bring it back.
on:
  workflow_dispatch:

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: pnpm/action-setup@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - run: pnpm build

      - run: pnpm test
