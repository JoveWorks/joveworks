name: CI

# A school is now deploying the `production` branch to run a real course,
# so PRs and pushes to `main` need their own build/test gate again — the
# "runs locally, solo project" reasoning that justified workflow_dispatch-only
# no longer holds once other people's work (and their downstream deployment)
# depends on `main` staying green.
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: pnpm/action-setup@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - run: pnpm build

      - run: pnpm test
