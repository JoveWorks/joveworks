name: Release

on:
  workflow_dispatch:
    inputs:
      release-as:
        description: "Version bump (leave blank to let commit history decide)"
        type: choice
        options: ["", patch, minor, major]
        default: ""
      prerelease:
        description: "Mark the GitHub Release as a pre-release (project is still alpha)"
        type: boolean
        default: true

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
          # A release is always cut from the development branch, even if this
          # manual workflow is started while viewing another branch in GitHub.
          ref: main

      - uses: pnpm/action-setup@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - run: pnpm build

      - run: pnpm test

      - run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

      - name: Bump version, update changelog, tag
        run: |
          if [ -n "${{ inputs.release-as }}" ]; then
            pnpm release --release-as "${{ inputs.release-as }}"
          else
            pnpm release
          fi

      - name: Push version and promote production
        run: |
          # `production` is a deployment pointer, not a development branch:
          # it must advance only to the just-tagged release commit. A normal
          # Git push enforces fast-forward-only promotion and creates the
          # branch on the first release.
          git push --follow-tags origin HEAD:main HEAD:production

      - name: Extract release notes
        id: notes
        run: |
          tag=$(git describe --tags --abbrev=0)
          awk '/^## /{ if (found) exit; found=1 } found' CHANGELOG.md > /tmp/release-notes.md
          echo "tag=$tag" >> "$GITHUB_OUTPUT"

      - name: Build stable bundle
        # `pnpm build` above (the CI gate) already ran once at the tip of
        # `main`; this repeats the tsc build as part of `build:bundle` so
        # __APP_VERSION__ picks up the version this job just bumped to.
        # JOVEWORKS_CHANNEL=stable is what distinguishes this from the
        # Netlify (nightly) build, which leaves it at the default.
        # JOVEWORKS_BASE_PATH=./ makes the editor's own asset references
        # relative — the app only ever routes with a `?example=` query
        # parameter (see exampleUrl.ts), never a path-based router, so a
        # relative base produces one bundle that works unmodified at the
        # domain root or under any subpath. (This overrides the "/" default
        # in vite.config.ts, which stays as-is for Netlify.) The docs
        # sub-site under build/docs/ is the one part of this bundle that
        # still assumes domain-root hosting — see the comment on `base` in
        # packages/docs-site/docs/.vitepress/config.ts for why, and
        # deploy/stable-bundle/README.txt for what that means for a school
        # hosting under a subpath.
        env:
          JOVEWORKS_CHANNEL: stable
          JOVEWORKS_BASE_PATH: ./
        run: pnpm build:bundle

      - name: Add static-host config to stable bundle
        # netlify.toml's SPA-fallback redirect only works on Netlify; the
        # school's static host needs its own equivalent. See
        # deploy/stable-bundle/README.txt for what these are and how to
        # use them.
        run: |
          cp deploy/stable-bundle/nginx.conf.snippet packages/editor/build/
          cp deploy/stable-bundle/.htaccess packages/editor/build/
          cp deploy/stable-bundle/README.txt packages/editor/build/

      - name: Zip stable bundle
        run: |
          zip_name="joveworks-stable-${{ steps.notes.outputs.tag }}.zip"
          (cd packages/editor/build && zip -rq "$GITHUB_WORKSPACE/$zip_name" .)
          echo "path=$zip_name" >> "$GITHUB_OUTPUT"
        id: bundle

      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "${{ steps.notes.outputs.tag }}" \
            "${{ steps.bundle.outputs.path }}#Stable bundle (static site, for self-hosting)" \
            --title "${{ steps.notes.outputs.tag }}" \
            --notes-file /tmp/release-notes.md \
            $([ "${{ inputs.prerelease }}" = "true" ] && echo --prerelease)
