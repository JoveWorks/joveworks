[build]
  # The full incantation (editor + docs-site + catalogue-author, assembled
  # into packages/editor/build) lives in the root package.json's
  # `build:bundle` script, so this and the release workflow's stable-bundle
  # step can't drift apart.
  command = "pnpm install && pnpm build:bundle"
  publish = "packages/editor/build"

[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200
