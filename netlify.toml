[build]
  command = "pnpm install && pnpm build && pnpm --filter @mds/editor build && pnpm --filter @mds/docs-site build && mkdir -p packages/editor/build/docs && cp -r packages/docs-site/docs/.vitepress/dist/. packages/editor/build/docs/"
  publish = "packages/editor/build"

[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200
