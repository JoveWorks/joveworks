[build]
  command = "pnpm install && pnpm build && pnpm --filter @joveworks/editor build && pnpm --filter @joveworks/docs-site build && pnpm --filter @joveworks/catalogue-author build && mkdir -p packages/editor/build/docs && cp -r packages/docs-site/docs/.vitepress/dist/. packages/editor/build/docs/ && mkdir -p packages/editor/build/author && cp -r packages/catalogue-author/build/. packages/editor/build/author/"
  publish = "packages/editor/build"

[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200
